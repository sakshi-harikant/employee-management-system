<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EMS - Manage Employees</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for brand consistency -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#FCFCFC] text-[#12131A] flex min-h-screen">

    <!-- 1. SIDEBAR CONFIGURATION (Matches Dashboard Exactly) -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <!-- Sidebar Header Brand with Custom Gradient Logo -->
            <div class="h-20 bg-slate-950 flex items-center px-6 border-b border-slate-800/60">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-gradient-to-br from-[#5D5FEF] to-[#4A3AFF] rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md">
                        <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="9" x2="20" y2="9"></line>
                            <line x1="4" y1="15" x2="20" y2="15"></line>
                            <line x1="10" y1="3" x2="8" y2="21"></line>
                            <line x1="16" y1="3" x2="14" y2="21"></line>
                        </svg>
                    </div>
                    <span class="text-base font-bold tracking-tight text-white">Registry Console</span>
                </div>
            </div>
            
            <!-- Navigation Links -->
            <nav class="mt-8 px-4 space-y-1.5">
                <a th:href="@{/admin/dashboard}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800/60 rounded-xl text-slate-400 hover:text-white font-medium transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"></path>
                    </svg>
                    Dashboard
                </a>
                <a th:href="@{/admin/employees}" class="flex items-center gap-3 px-4 py-3 bg-[#4A3AFF] rounded-xl text-white font-medium transition-all shadow-md shadow-indigo-950/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"></path>
                    </svg>
                    Manage Employees
                </a>
                <a th:href="@{/admin/departments}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800/60 rounded-xl text-slate-400 hover:text-white font-medium transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 16.5h.75m3 0h.75m3 0h.75m3-12h.75m-.75 3h.75m-.75 3h.75M16.5 16.5h.75"></path>
                    </svg>
                    Manage Departments
                </a>
            </nav>
        </div>
        
        <!-- Sidebar Footer Action (Premium Dark Neutral Sign Out Button - No Red) -->
        <div class="p-4 border-t border-slate-800/60">
            <a th:href="@{/logout}" class="flex items-center justify-center gap-2 w-full py-2.5 bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-white font-semibold rounded-xl transition-all text-xs cursor-pointer tracking-wide">
                <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"></path>
                </svg>
                Sign Out
            </a>
        </div>
    </aside>

    <!-- 2. MAIN WORKSPACE VIEW -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Application Top Header Bar -->
        <header class="h-20 bg-white border-b border-slate-100 flex items-center justify-between px-8 shrink-0">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Manage Employees</h2>
            <a th:href="@{/admin/employees/add}" class="bg-[#4A3AFF] hover:bg-[#3d2fe0] text-white font-semibold py-2.5 px-5 rounded-xl shadow-md shadow-indigo-100 hover:shadow-none transition-all flex items-center gap-2 text-xs tracking-wide cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
                </svg>
                Add Employee
            </a>
        </header>

        <!-- Main Workspace Scrollable Container -->
        <div class="p-8 space-y-6 flex-1 overflow-y-auto">
            
            <!-- A. PREMIUM LOOK SEARCH FILTER BOX -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <form th:action="@{/admin/employees}" method="GET" class="flex gap-3">
                    <div class="relative flex-1">
                        <input type="text" name="search" th:value="${searchKeyword}" placeholder="Search employees by name or email..." 
                               class="w-full pl-4 pr-4 py-2.5 rounded-xl border border-slate-200 outline-none focus:border-[#4A3AFF] focus:ring-4 focus:ring-indigo-50 text-xs text-slate-700 placeholder-slate-400 font-medium transition-all">
                    </div>
                    <button type="submit" class="bg-slate-900 hover:bg-slate-950 text-white font-semibold px-5 py-2.5 rounded-xl text-xs transition-all tracking-wide cursor-pointer shadow-sm">Search</button>
                    <a th:href="@{/admin/employees}" class="bg-slate-100 hover:bg-slate-200/80 text-slate-600 font-semibold px-4 py-2.5 rounded-xl text-xs transition-all flex items-center cursor-pointer">Clear</a>
                </form>
            </div>

            <!-- B. CUSTOMERS/EMPLOYEES MAIN DATA TABLE -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/50 text-slate-400 text-[10px] font-bold uppercase tracking-wider border-b border-slate-100">
                                <th class="py-4 px-6">ID</th>
                                <th class="py-4 px-6">Name</th>
                                <th class="py-4 px-6">Email / Phone</th>
                                <th class="py-4 px-6">Department</th>
                                <th class="py-4 px-6">Designation</th>
                                <th class="py-4 px-6">Role</th>
                                <th class="py-4 px-6 text-right pr-8">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 text-slate-700 text-xs">
                            <tr th:each="emp : ${employees}" class="hover:bg-indigo-50/30 transition-all">
                                <td class="py-4 px-6 font-bold text-[#4A3AFF]" th:text="${'# ' + emp.id}"></td>
                                <td class="py-4 px-6 font-semibold text-slate-900" th:text="${emp.name}"></td>
                                <td class="py-4 px-6 space-y-0.5">
                                    <div class="text-slate-800 font-medium" th:text="${emp.email}"></div>
                                    <div class="text-[11px] text-slate-400 tracking-wide font-medium" th:text="${emp.phone ?: 'No phone provided'}"></div>
                                </td>
                                <td class="py-4 px-6 text-slate-500 font-medium" th:text="${emp.department != null ? emp.department.name : 'Unassigned'}"></td>
                                <td class="py-4 px-6">
                                    <span class="bg-indigo-50 text-[#4A3AFF] px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide" th:text="${emp.designation}"></span>
                                </td>
                                <td class="py-4 px-6">
                                    <!-- Dynamic Class Evaluation Retained Perfectly -->
                                    <span th:class="${emp.role == 'ADMIN' ? 'bg-purple-50 text-purple-700 border border-purple-100/60' : 'bg-slate-100 text-slate-600'} + ' px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase'" th:text="${emp.role}"></span>
                                </td>
                                <td class="py-4 px-6 text-right pr-8">
                                    <div class="flex items-center justify-end gap-1.5">
                                        <!-- Edit Action Button Wrapper -->
                                        <a th:href="@{/admin/employees/edit/{id}(id=${emp.id})}" class="p-1.5 text-slate-400 hover:text-[#4A3AFF] hover:bg-indigo-50 rounded-lg transition-all" title="Edit Profile">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"></path>
                                            </svg>
                                        </a>
                                        <!-- Delete Action Button Wrapper -->
                                        <a th:href="@{/admin/employees/delete/{id}(id=${emp.id})}" onclick="return confirm('Delete this employee record permanentely?')" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="Delete Profile">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"></path>
                                            </svg>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- Fallback Row Layout -->
                            <tr th:if="${#lists.isEmpty(employees)}">
                                <td colspan="7" class="py-12 text-center text-slate-400 font-medium">
                                    <div class="text-2xl mb-2">🔍</div>
                                    No matching employee records discovered.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
