<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EMS - Department Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for brand consistency -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#FCFCFC] text-[#12131A] flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <!-- Brand Theme Form Header -->
        <div class="bg-slate-900 px-8 py-5 border-b border-slate-800/60">
            <h1 class="text-base font-bold text-white tracking-tight" 
                th:text="${department.id == null ? 'Add New Department' : 'Edit Department'}">Department Form</h1>
        </div>

        <form th:action="@{/admin/departments/save}" th:object="${department}" method="POST" class="px-8 py-7 space-y-5">
            <!-- Hidden input to keep track of the ID during updates -->
            <input type="hidden" th:field="*{id}" />

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Department Name</label>
                <input type="text" th:field="*{name}" required placeholder="e.g., Human Resources, Engineering"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 outline-none focus:border-[#4A3AFF] focus:ring-4 focus:ring-indigo-50 text-xs text-slate-700 placeholder-slate-400 font-medium transition-all">
            </div>

            <div class="flex items-center gap-3 pt-2">
                <a th:href="@{/admin/departments}" class="w-1/2 text-center bg-slate-100 hover:bg-slate-200/80 text-slate-600 font-semibold py-2.5 px-4 rounded-xl text-xs transition-all cursor-pointer">
                    Cancel
                </a>
                <button type="submit" class="w-1/2 bg-[#4A3AFF] hover:bg-[#3d2fe0] text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-indigo-100 hover:shadow-none transition-all text-xs tracking-wide cursor-pointer">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

</body>
</html>
